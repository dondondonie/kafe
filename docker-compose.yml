version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kafe-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kafe_db
      MYSQL_USER: kafe_user
      MYSQL_PASSWORD: kafe_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - kafe-network

  redis:
    image: redis:7-alpine
    container_name: kafe-redis
    ports:
      - "6379:6379"
    networks:
      - kafe-network

volumes:
  mysql_data:

networks:
  kafe-network:
    driver: bridge
